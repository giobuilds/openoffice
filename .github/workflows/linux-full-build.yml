# Roadmap Phase 0: full Linux office build, headless smoke, and an
# installable tree as an artifact. Runs nightly and on demand, and on
# pull requests that change this job itself. It takes hours, so it is
# not part of the per-PR check set.

name: linux-full-build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux-full-build.yml'
      - '.github/scripts/linux-full-build.sh'
      - '.github/scripts/smoke_roundtrip.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-build:
    name: full office build + smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check Out
        uses: actions/checkout@v6

      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - name: Install packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ant \
            autoconf \
            bison \
            ca-certificates \
            ccache \
            flex \
            fonts-dejavu-core \
            fonts-liberation \
            g++ \
            gcc \
            gperf \
            libarchive-zip-perl \
            libboost-dev \
            libcurl4-openssl-dev \
            libdigest-sha-perl \
            libexpat1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libxml2-dev \
            libxslt1-dev \
            liblwp-protocol-https-perl \
            libpam0g-dev \
            libssl-dev \
            libwww-perl \
            libx11-dev \
            libxaw7-dev \
            libxext-dev \
            libxinerama-dev \
            libxml-parser-perl \
            libxrandr-dev \
            libxrender-dev \
            libxt-dev \
            make \
            patch \
            pkg-config \
            python3-dev \
            unzip \
            wget \
            xsltproc \
            zip \
            zlib1g-dev \
            zstd

      # restore/save split so the cache is saved even when the job fails:
      # actions/cache's post step only runs on success, which kept every
      # iteration of this job a cold build.
      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ~/.ccache
          key: ccache-full-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-full-${{ runner.os }}-

      - name: Cache external tarballs
        uses: actions/cache@v5
        with:
          path: ext_sources
          key: ext-tarballs-${{ hashFiles('main/external_deps.lst') }}
          restore-keys: |
            ext-tarballs-

      - name: Configure, bootstrap, build --all
        run: bash .github/scripts/linux-full-build.sh build

      - name: Headless smoke
        run: bash .github/scripts/linux-full-build.sh smoke

      - name: Pack installed office
        if: success()
        run: |
          office="$(ls -d main/instsetoo_native/*/Apache_OpenOffice/installed/install/en-US/*/ | sed -n '1p')"
          echo "office=${office}"
          tar -C "$(dirname "${office}")" -I 'zstd -T0 -3' -cf work-linux-x86_64.tar.zst "$(basename "${office}")"
          ls -lh work-linux-x86_64.tar.zst

      - name: Upload installed office
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: work-linux-x86_64-installed
          path: work-linux-x86_64.tar.zst
          retention-days: 7

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.ccache
          key: ccache-full-${{ runner.os }}-${{ github.run_id }}

      - name: Compress build log
        if: always()
        run: test -f build.log && zstd -q -T0 -19 build.log -o build.log.zst || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log.zst
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-outputs
          path: .smoke/out
          if-no-files-found: ignore
          retention-days: 7
