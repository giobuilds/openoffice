# Slim Linux compile of bundled ICU (issue #3 phase 2).
# linux-sal-gtest.yml still uses --with-system-icu via distro packages
# if present; this job compiles the vendored 78.3 module.

name: linux-icu

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  icu:
    name: bundled ICU
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check Out
        uses: actions/checkout@v6

      - name: Install packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf \
            bison \
            ca-certificates \
            ccache \
            flex \
            g++ \
            gcc \
            gperf \
            libarchive-zip-perl \
            libboost-dev \
            libcurl4-openssl-dev \
            libdigest-sha-perl \
            libexpat1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libpng-dev \
            liblwp-protocol-https-perl \
            libpam0g-dev \
            libssl-dev \
            libwww-perl \
            libx11-dev \
            libxaw7-dev \
            libxext-dev \
            libxml-parser-perl \
            libxrandr-dev \
            libxrender-dev \
            libxt-dev \
            make \
            patch \
            pkg-config \
            python3-dev \
            unzip \
            wget \
            xz-utils \
            xsltproc \
            zlib1g-dev

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-icu-${{ runner.os }}-v1
          restore-keys: |
            ccache-icu-${{ runner.os }}-

      - name: Cache external tarballs
        uses: actions/cache@v5
        with:
          path: ext_sources
          key: ext-tarballs-${{ hashFiles('main/external_deps.lst') }}
          restore-keys: |
            ext-tarballs-

      - name: Configure, build bundled ICU
        run: bash .github/scripts/linux-icu.sh
